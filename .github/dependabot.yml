# .github/dependabot.yml
#
# Dependabot configuration for forensic-grade dependency monitoring.
#
# Forensic value: Dependabot creates a timestamped audit trail of every
# dependency change. Each PR records: which package, from which version
# to which version, by which automated actor, at what time. This log is
# the evidence base for supply-chain incident reconstruction.

version: 2
updates:
  # ─── npm dependencies (Next.js app lives in web-app/) ────────────
  - package-ecosystem: "npm"
    directory: "/web-app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      production-dependencies:
        dependency-type: "production"
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(dev-deps)"
      include: "scope"

  # ─── GitHub Actions versions ─────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(actions)"
