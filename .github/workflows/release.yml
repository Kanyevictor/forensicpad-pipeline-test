# .github/workflows/release.yml
#
# Forensic-grade release workflow:
#   1. Builds the Next.js application
#   2. Generates a Software Bill of Materials (Syft)
#   3. Signs the artifact AND the SBOM via Sigstore (keyless)
#   4. Publishes everything to a GitHub Release

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-sign:
    name: Build, SBOM, Sign, Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # create GitHub Release
      id-token: write   # OIDC -> Sigstore Fulcio

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v0.0.0-test-$(date +%Y%m%d-%H%M%S)"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building release: ${TAG}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.1'
          cache: 'npm'
          cache-dependency-path: web-app/package-lock.json

      - name: Install dependencies
        working-directory: web-app
        run: npm ci

      - name: Build
        working-directory: web-app
        env:
          GITHUB_TOKEN: "ci-build-placeholder-not-a-real-token"
          GITHUB_OWNER: "ci-build-placeholder"
          GITHUB_REPO: "ci-build-placeholder"
          GITHUB_BRANCH: "main"
          OPENROUTER_API_KEY: "ci-build-placeholder-not-a-real-key"
        run: npm run build

      - name: Package build output
        run: |
          tar --exclude='./cache' -czf next-build.tar.gz -C web-app/.next .
          ls -lh next-build.tar.gz

      - name: Compute artifact hash
        id: hash
        run: |
          HASH=$(sha256sum next-build.tar.gz | cut -d' ' -f1)
          echo "artifact_hash=${HASH}" >> "$GITHUB_OUTPUT"
          echo "Artifact SHA-256: ${HASH}"

      # SBOM generation
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./web-app
          format: spdx-json
          output-file: sbom.spdx.json

      # Signing
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign artifact (keyless via OIDC)
        run: |
          cosign sign-blob --yes \
            --bundle next-build.tar.gz.cosign.bundle \
            next-build.tar.gz

      - name: Sign SBOM (keyless via OIDC)
        run: |
          cosign sign-blob --yes \
            --bundle sbom.spdx.json.cosign.bundle \
            sbom.spdx.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.release_tag }}
          ARTIFACT_HASH: ${{ steps.hash.outputs.artifact_hash }}
        run: |
          cat > release-notes.md <<NOTES
          ## ForensicPad Release

          **Tag:** ${RELEASE_TAG}
          **Commit:** ${GITHUB_SHA}
          **Workflow run:** ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          **Artifact SHA-256:** \`${ARTIFACT_HASH}\`

          ### Forensic Attestations
          - \`next-build.tar.gz\` — deterministic build output
          - \`sbom.spdx.json\` — Software Bill of Materials (SPDX 2.3)
          - \`next-build.tar.gz.cosign.bundle\` — Sigstore signature
          - \`sbom.spdx.json.cosign.bundle\` — SBOM signature

          ### Verify

          \`\`\`bash
          cosign verify-blob \\
            --bundle next-build.tar.gz.cosign.bundle \\
            --certificate-identity-regexp "^https://github\\.com/${GITHUB_REPOSITORY}/" \\
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \\
            next-build.tar.gz
          \`\`\`
          NOTES

          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${RELEASE_TAG}" \
            --notes-file release-notes.md \
            next-build.tar.gz \
            sbom.spdx.json \
            next-build.tar.gz.cosign.bundle \
            sbom.spdx.json.cosign.bundle

      - name: Summary
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.release_tag }}
          ARTIFACT_HASH: ${{ steps.hash.outputs.artifact_hash }}
        run: |
          {
            echo "## Release ${RELEASE_TAG} published"
            echo ""
            echo "**SHA-256:** \`${ARTIFACT_HASH}\`"
            echo ""
            echo "[View release](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG})"
          } >> "$GITHUB_STEP_SUMMARY"
